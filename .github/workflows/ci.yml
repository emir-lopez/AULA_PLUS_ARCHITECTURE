# CI/CD de AulaPlus
#   1. calidad   : Ruff + pytest con cobertura >= 80 % (SQLite) + pruebas contra PostgreSQL de servicio
#   2. docker    : build de la imagen y suite completa con docker compose (DB + App + Tests)
#   3. deploy    : en push a main, dispara el deploy hook de Render (si el secreto existe)
name: CI Business Logic

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, pruebas y cobertura
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aulaplus
          POSTGRES_PASSWORD: aulaplus_ci
          POSTGRES_DB: aulaplus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aulaplus -d aulaplus_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://aulaplus:aulaplus_ci@localhost:5432/aulaplus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check src tests
      - name: Pytest + cobertura (falla si < 80 %)
        run: >-
          pytest --cov --cov-report=term-missing --cov-report=xml:reports/coverage.xml
          --junitxml=reports/junit.xml --cov-fail-under=80
      - name: Exportar contrato OpenAPI
        run: python scripts/exportar_openapi.py reports/openapi.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-calidad
          path: reports/

  docker:
    name: Docker Compose (DB + App + Tests)
    needs: calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imágenes
        run: docker compose --profile test build
      - name: Levantar DB + App y esperar healthcheck
        run: |
          docker compose up -d --wait --wait-timeout 120
          curl --fail --silent http://localhost:8000/health
          curl --fail --silent --output /dev/null http://localhost:8000/docs
      - name: Suite completa contra PostgreSQL en contenedor
        run: docker compose --profile test run --rm tests
      - name: Logs si falla
        if: failure()
        run: docker compose logs
      - name: Apagar
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy a Render
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Secreto RENDER_DEPLOY_HOOK_URL no configurado: se omite el deploy."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
